# The refactor's gate (card R0): type-check and test every push and pull request. It deploys nothing.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx prettier --check "src/**/*.{ts,tsx}" "scripts/**/*.ts" "*.js" "*.ts"
      - run: npm test
